[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "boter-kaas-eieren"
version = "0.1.0"
description = "A small command-line boter-kaas-eieren game"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Patrick van Bergen" }]
dependencies = []

[project.scripts]
boter-kaas-eieren = "boter_kaas_eieren.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/boter_kaas_eieren"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
